<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>QuoteSnap</title>
  <meta name="description" content="Snap photos, describe the job, send a professional tree care or snow removal quote in minutes." />
  <meta name="theme-color" content="#1f5f3f" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar no-print">
    <a href="#/" class="brand"><img src="icons/icon.svg" alt="" width="28" height="28" /> QuoteSnap</a>
    <nav class="nav" id="nav">
      <a href="#/" data-route="dashboard">Dashboard</a>
      <a href="#/estimates" data-route="estimates">Quotes</a>
      <a href="#/customers" data-route="customers">Customers</a>
      <a href="#/pricebook" data-route="pricebook">Price Book</a>
      <a href="#/settings" data-route="settings">Settings</a>
    </nav>
    <a href="#/new" class="btn primary new-btn">+ New Quote</a>
  </header>

  <main id="app" class="app"><div class="empty" id="boot-msg">Loading QuoteSnap…</div></main>

  <nav class="tabbar no-print" id="tabbar">
    <a href="#/" data-route="dashboard"><span>▦</span>Home</a>
    <a href="#/estimates" data-route="estimates"><span>☰</span>Quotes</a>
    <a href="#/new" data-route="new" class="tab-new"><span>＋</span>New</a>
    <a href="#/customers" data-route="customers"><span>☺</span>Customers</a>
    <a href="#/settings" data-route="settings"><span>⚙</span>More</a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="modal" class="modal"></dialog>

  <script>
    // Polyfills for older phone browsers (runs before the app modules).
    if (typeof structuredClone !== 'function') window.structuredClone = function (v) { return v === undefined ? v : JSON.parse(JSON.stringify(v)); };
    if (!Array.prototype.at) Array.prototype.at = function (i) { i = Math.trunc(i) || 0; if (i < 0) i += this.length; return this[i]; };

    // If the app can't start, say why instead of showing a blank page.
    window.__qsFail = function (msg) {
      if (window.__qsStarted) return;
      var el = document.getElementById('app');
      if (!el) return;
      el.innerHTML = '<div class="card" style="max-width:520px;margin:2rem auto"><h2>QuoteSnap couldn\'t start</h2>' +
        '<p>Try these:</p><ul><li>Open the link in <b>Safari</b> (iPhone) or <b>Chrome</b> (Android), not inside Gmail, Facebook or another app.</li>' +
        '<li>Turn off <b>Private</b> / Incognito browsing.</li><li>Update your phone\'s software, then pull down to reload.</li></ul>' +
        '<p class="muted small">Details: ' + String(msg).replace(/[<>&]/g, '') + '</p>' +
        '<button class="btn primary" onclick="location.reload()">Reload</button></div>';
    };
    window.addEventListener('error', function (e) { window.__qsFail(e.message || 'Script error'); });
    window.addEventListener('unhandledrejection', function (e) { window.__qsFail((e.reason && e.reason.message) || e.reason); });
    setTimeout(function () { window.__qsFail('The app did not load within 12 seconds. Check your connection.'); }, 12000);
  </script>
  <script type="module" src="js/app.js"></script>
  <script nomodule>window.__qsFail('This browser is too old to run QuoteSnap.');</script>
</body>
</html>
